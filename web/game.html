<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recicly City | Operações Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14; --panel: #151921; --header: #1c222d;
            --accent: #238636; --rare: #3b82f6; --legendary: #f59e0b;
            --text: #f8fafc; --muted: #64748b; --border: #ffffff10;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; gap: 8px;
            overflow: hidden;
        }

        /* TELA DE BLOQUEIO */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .btn-auth {
            background: #f97316; color: white; border: none; padding: 12px 24px;
            border-radius: 8px; font-weight: 800; cursor: pointer; text-decoration: none;
            margin-top: 20px; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        /* TABS COMPACTAS */
        .tabs { display: flex; gap: 4px; height: 35px; }
        .tab {
            flex: 1; padding: 0; text-align: center; font-size: 0.65rem; font-weight: 700;
            cursor: pointer; border-radius: 6px; background: var(--panel); color: var(--muted);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* DASHBOARD AREA */
        .dashboard {
            background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
            display: flex; flex-direction: column; flex: 1; overflow: hidden;
        }
        .dashboard-header { background: var(--header); padding: 6px 12px; font-size: 0.7rem; font-weight: 800; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }

        /* ESTEIRA SLIM */
        .belt-area {
            padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            background: linear-gradient(180deg, #111827 0%, #0d1117 100%);
        }
        .belt-container {
            width: 100%; height: 60px; background: #000; border-radius: 8px; border: 1px dashed var(--border);
            position: relative; overflow: hidden; display: flex; align-items: center;
        }
        #active-item { position: absolute; font-size: 2rem; left: -50px; z-index: 10; }
        .belt-label { position: absolute; top: 2px; font-size: 0.5rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; }

        .btn-process {
            width: 100%; background: var(--accent); color: white; border: none; padding: 10px;
            border-radius: 8px; font-weight: 800; font-size: 0.8rem; cursor: pointer;
        }

        /* STATUS STRIP */
        .status-strip {
            background: #00000060; padding: 6px 12px; display: flex; justify-content: space-between;
            font-size: 0.6rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
            align-items: center;
        }
        .energy-bar-wrap { display: flex; align-items: center; gap: 5px; }
        .energy-bar { width: 40px; height: 5px; background: #1e293b; border-radius: 10px; overflow: hidden; }
        #energy-fill { height: 100%; background: #3b82f6; width: 100%; transition: 0.3s; }

        /* INVENTÁRIO (GRID 9) */
        .inventory-grid {
            display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; padding: 8px;
            background: #00000020; flex: 1; overflow-y: auto;
        }
        .inv-slot {
            background: #0b0e14; border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 2px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .inv-icon { font-size: 1rem; }
        .inv-count { font-size: 0.7rem; font-weight: 800; color: #fff; }
        .inv-name { font-size: 0.35rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }

        .btn-sell { background: #f59e0b; color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: 800; font-size: 0.7rem; margin: 5px 10px; cursor: pointer; }

        /* LOGS */
        .terminal {
            background: #000; margin: 0 10px 5px 10px; padding: 8px; border-radius: 6px;
            font-family: monospace; font-size: 0.55rem; color: #64748b; height: 50px; overflow-y: auto;
            border: 1px solid var(--border); line-height: 1.2;
        }
        .log-g { color: var(--accent); }

        @media (max-width: 600px) { .inventory-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div id="lock-screen">
        <h1 style="margin:0; letter-spacing:-2px; color:#fff">RECICLY CITY</h1>
        <p style="color:var(--muted); font-size:0.8rem;">Dashboard de Operações Industriais</p>
        <a href="index.html" class="btn-auth">🔓 CONECTAR CARTEIRA ECOPACTO</a>
    </div>

    <!-- UI -->
    <div class="tabs">
        <div class="tab active">🏭 Pátio</div>
        <div class="tab">🛒 Loja</div>
        <div class="tab">👤 Perfil</div>
        <div class="tab">🏆 Ranking</div>
    </div>

    <div class="main-card">
        <div class="dashboard-header">
            <span>🏗️ Triagem de Lote</span>
            <span style="color:var(--muted); font-size:0.55rem;">AUTO: 0/S</span>
        </div>

        <div class="belt-area">
            <div class="belt-container">
                <div id="active-item"></div>
                <div class="belt-label" id="belt-info">AGUARDANDO...</div>
            </div>
            <button class="btn-process" id="proc-btn" onclick="startBatch()">▶ PROCESSAR PRÓXIMO LOTE</button>
        </div>

        <div class="status-strip">
            <div>Sede: <span id="sede-name" style="color:white; font-weight:800">🏚️ Barraco</span></div>
            <div>Lvl: <span id="lvl-val" style="color:white; font-weight:800">1</span></div>
            <div class="energy-bar-wrap">
                E: <div class="energy-bar"><div id="energy-fill"></div></div>
            </div>
            <div>💰 <span id="ecp-val" style="color:var(--accent); font-weight:800">0</span></div>
            <button class="tab" style="padding:2px 8px; font-size:0.5rem; background:#f97316; color:white; border:none; flex:none; height:18px;" onclick="window.location.href='index.html'">Hub</button>
        </div>

        <div class="inventory-grid" id="inv-grid">
            <!-- Itens gerados via JS -->
        </div>

        <button class="btn-sell" onclick="sellItems()">💰 VENDER MATERIAIS</button>

        <div class="terminal" id="logs">
            <div class="log-g">[Sistema]: Dashboard v2.2 conectado.</div>
        </div>
    </div>

<script>
    const API_URL = "https://ecopacto-api-production.up.railway.app";
    const wallet = JSON.parse(localStorage.getItem('eco_wallet'));

    if(wallet) document.getElementById('lock-screen').style.display = 'none';

    let state = {
        level: 1, energy: 100, ecp: 0, items: 0,
        inventory: { plastic: 0, paper: 0, alum: 0, copper: 0, lithium: 0, parts: 0, phone: 0, board: 0, chip: 0 }
    };

    const MATERIAL_DATA = [
        { id: 'plastic', name: "Plástico", icon: "🧴", chance: 60, speed: 1000, reward: 1 },
        { id: 'paper', name: "Papelão", icon: "📦", chance: 20, speed: 1000, reward: 2 },
        { id: 'alum', name: "Alumínio", icon: "🥫", chance: 12, speed: 1000, reward: 5 },
        { id: 'copper', name: "Cobre", icon: "🔌", chance: 5, speed: 2000, reward: 20 },
        { id: 'lithium', name: "Lítio", icon: "🔋", chance: 2, speed: 2000, reward: 50 },
        { id: 'parts', name: "Peças", icon: "💻", chance: 0.8, speed: 3000, reward: 150 },
        { id: 'phone', name: "Smartphone", icon: "📱", chance: 0.15, speed: 3000, reward: 500 },
        { id: 'board', name: "Placa-Mãe", icon: "🖥️", chance: 0.05, speed: 3000, reward: 1000 },
        { id: 'chip', name: "Chip", icon: "⚡", chance: 0.01, speed: 4000, reward: 5000 }
    ];

    function initInventory() {
        const grid = document.getElementById('inv-grid');
        grid.innerHTML = MATERIAL_DATA.map(m => `
            <div class="inv-slot">
                <div class="inv-icon">${m.icon}</div>
                <div class="inv-count" id="count-${m.id}">0</div>
                <div class="inv-name">${m.name}</div>
            </div>
        `).join('');
        updateUI();
    }

    function updateUI() {
        document.getElementById('lvl-val').innerText = state.level;
        document.getElementById('energy-fill').style.width = state.energy + "%";
        document.getElementById('ecp-val').innerText = state.ecp.toLocaleString();
        for(let key in state.inventory) {
            const el = document.getElementById(`count-${key}`);
            if(el) el.innerText = state.inventory[key].toLocaleString();
        }
        const sede = document.getElementById('sede-name');
        if(state.level >= 100) sede.innerText = "🌎 City";
        else if(state.level >= 50) sede.innerText = "🌆 Recicly";
        else if(state.level >= 25) sede.innerText = "🏭 Galpão";
        else if(state.level >= 10) sede.innerText = "🏠 Centro";
    }

    function startBatch() {
        if(state.energy <= 0) return addLog("Sem energia!", "#f97316");
        const btn = document.getElementById('proc-btn');
        btn.disabled = true;

        let r = Math.random() * 100;
        let acc = 0;
        let sel = MATERIAL_DATA[0];
        for(let m of MATERIAL_DATA) { acc += m.chance; if(r <= acc) { sel = m; break; } }

        const sprite = document.getElementById('item-active');
        document.getElementById('belt-info').innerText = sel.name.toUpperCase();
        sprite.innerText = sel.icon;
        sprite.style.left = "-40px";

        let start = null;
        function frame(t) {
            if(!start) start = t;
            let p = (t - start) / sel.speed;
            if(p < 1) {
                sprite.style.left = `calc(${p * 100}% - 20px)`;
                requestAnimationFrame(frame);
            } else {
                state.energy--;
                state.inventory[sel.id]++;
                state.items++;
                addLog(`+1 ${sel.name}`);

                if(sel.id === 'chip' && wallet) {
                    fetch(`${API_URL}/mine?address=${wallet.address}`)
                        .then(r => r.json())
                        .then(data => addLog("✨ BLOCO MINERADO! +100 ECO REAIS.", "var(--orange)"));
                }

                if(state.items % 15 === 0) state.level++;
                updateUI();
                btn.disabled = false;
                document.getElementById('belt-info').innerText = "AGUARDANDO...";
            }
        }
        requestAnimationFrame(frame);
    }

    function addLog(msg, color = "") {
        const logs = document.getElementById('logs');
        logs.innerHTML = `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>` + logs.innerHTML;
    }

    function sellItems() {
        let total = 0;
        MATERIAL_DATA.forEach(m => {
            total += state.inventory[m.id] * m.reward;
            state.inventory[m.id] = 0;
        });
        state.ecp += total;
        addLog(`💰 Venda realizada: +${total} ECP`, "var(--accent)");
        updateUI();
    }

    initInventory();
    setInterval(() => { if(state.energy < 100) { state.energy++; updateUI(); } }, 8000);
</script>
</body>
</html>
