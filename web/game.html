<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoPacto | Pátio de Coleta</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07080c;
            --panel: #12141c;
            --panel-h: #1a1f2e;
            --accent: #22c55e;
            --text: #ffffff;
            --muted: #8b95a8;
            --border: #ffffff14;
            --orange: #f97316;
            --rare: #3b82f6;
            --epic: #a855f7;
            --legendary: #f59e0b;
            --mythic: #ef4444;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: 4px;
            height: 30px;
            min-height: 30px;
        }
        .tab {
            flex: 1;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--muted);
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
        }
        .tab.active {
            background: var(--accent);
            color: #04120a;
            border-color: var(--accent);
        }

        .page { display: none; flex-direction: column; flex: 1; min-height: 0; gap: 6px; }
        .page.active { display: flex; }

        .hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 8px;
            font-size: 0.68rem;
        }
        .hud-left { color: var(--muted); }
        .hud-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .pill {
            background: #0b0d13;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 3px 6px;
            white-space: nowrap;
        }
        .wallet-btn {
            background: var(--orange);
            color: #fff;
            border: 0;
            border-radius: 7px;
            height: 22px;
            padding: 0 7px;
            font-size: 0.62rem;
            font-weight: 700;
            cursor: pointer;
        }

        .belt-area {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
        }
        .belt-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .special { color: var(--accent); font-weight: 800; letter-spacing: .04em; }
        .belt-container {
            height: 58px;
            background: #0a0c11;
            border: 1px dashed #ffffff18;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        #item-active {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            left: -40px;
            z-index: 3;
        }
        .drop-box {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 26px;
        }
        .drop-box.received { filter: brightness(1.4); }

        .btn {
            border: 0;
            border-radius: 8px;
            height: 28px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
        }
        .btn-process {
            width: 100%;
            background: var(--accent);
            color: #04120a;
            margin-top: 6px;
        }
        .btn-sell {
            width: 100%;
            background: #eab308;
            color: #1a1400;
            height: 26px;
            font-size: 0.68rem;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            flex: 1;
            min-height: 0;
            align-content: start;
        }
        .inv-slot {
            background: #141824;
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 54px;
            padding: 4px 2px 3px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px;
        }
        .inv-icon { font-size: 1.05rem; line-height: 1; }
        .inv-count { font-size: 0.72rem; font-weight: 800; }
        .inv-name {
            font-size: 0.48rem;
            color: var(--muted);
            letter-spacing: .02em;
            text-transform: uppercase;
        }

        .shop-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .shop-tab {
            height: 24px;
            padding: 0 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--muted);
            font-size: 0.62rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .shop-tab.active {
            background: var(--panel-h);
            color: #fff;
            border-color: #ffffff44;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
        }
        .shop-item {
            background: #141824;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            min-height: 78px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name { margin: 0; font-size: 0.78rem; }
        .item-desc { margin: 3px 0 0; font-size: 0.58rem; color: var(--muted); }
        .price-row { display: flex; gap: 4px; margin-top: 6px; }
        .buy-btn {
            height: 22px;
            flex: 1;
            border: 0;
            border-radius: 5px;
            font-size: 0.58rem;
            font-weight: 800;
            cursor: pointer;
        }
        .eco-btn { background: var(--accent); color: #04120a; }
        .bnb-btn { background: transparent; color: var(--orange); border: 1px solid #f9731644; flex: 0 0 64px; }

        .profile-card, .rank-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }
        .input-text {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            margin: 8px 0;
        }

        #lock-screen {
            position: fixed; inset: 0; background: #05070a; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .hidden { display: none !important; }

        @media (max-width: 720px) {
            .inventory-grid { grid-template-columns: repeat(4, 1fr); }
            .shop-grid { grid-template-columns: 1fr; }
            .hud { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div id="lock-screen">
    <div style="font-size:1.4rem;font-weight:800;">♻️ EcoPacto</div>
    <p style="color:var(--muted);font-size:0.8rem;">Conecte sua carteira para abrir o pátio.</p>
    <a href="index.html" class="btn btn-process" style="width:180px;text-decoration:none;display:flex;align-items:center;justify-content:center;">Conectar hub</a>
</div>

<div class="tabs">
    <button class="tab active" onclick="showPage('patio', this)">Pátio</button>
    <button class="tab" onclick="showPage('shop', this); filterShop('energy', document.querySelector('.shop-tab'))">Loja</button>
    <button class="tab" onclick="showPage('profile', this)">Perfil</button>
    <button class="tab" onclick="showPage('ranking', this)">Ranking</button>
</div>

<div id="patio" class="page active">
    <div class="hud">
        <div class="hud-left">Sede: <strong>Barraco de Triagem</strong></div>
        <div class="hud-right">
            <span class="pill">Nv. <strong id="header-level">1</strong></span>
            <span class="pill">⚡ <strong id="header-energy">100/100</strong></span>
            <span class="pill" id="energy-timer-header">03:00</span>
            <span class="pill">ECO <strong id="header-eco">0</strong></span>
            <button class="wallet-btn" onclick="connectMetaMask()" id="mm-btn">Carteira</button>
        </div>
    </div>

    <div class="belt-area">
        <div class="belt-head">
            <span id="belt-label">Esteira lvl 1</span>
            <span class="special" id="special-label">Aguardando lote</span>
        </div>
        <div class="belt-container">
            <div id="item-active"></div>
            <div class="drop-box" id="box-main">📦</div>
        </div>
        <button class="btn btn-process" id="btn-loop" onclick="toggleAuto()">▶ Processar próximo lote</button>
    </div>

    <div class="inventory-grid" id="inventory-grid"></div>
    <button class="btn btn-sell" onclick="sellAll()">Vender materiais por ECO</button>
</div>

<div id="shop" class="page">
    <div class="shop-tabs">
        <button class="shop-tab active" onclick="filterShop('energy', this)">Energia</button>
        <button class="shop-tab" onclick="filterShop('staff', this)">Equipe</button>
        <button class="shop-tab" onclick="filterShop('robots', this)">Robôs</button>
        <button class="shop-tab" onclick="filterShop('belts', this)">Esteiras</button>
        <button class="shop-tab" onclick="filterShop('boosters', this)">Boosters</button>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
</div>

<div id="profile" class="page">
    <div class="profile-card">
        <div><span>Nome:</span> <strong id="prof-name">Operador</strong></div>
        <div><span>ID:</span> <small id="prof-id">-</small></div>
        <div><span>Convidados:</span> <strong id="prof-invites">0</strong></div>
        <input type="text" id="input-name" class="input-text" placeholder="Apelido">
        <button class="btn btn-process" onclick="saveProfile()">Salvar</button>
    </div>
</div>

<div id="ranking" class="page">
    <div class="rank-card">Ranking ainda não sincronizado com a rede.</div>
</div>

<script>
    const wallet = JSON.parse(localStorage.getItem('eco_wallet'));
    if (wallet) document.getElementById('lock-screen').classList.add('hidden');

    let state = {
        eco: 0, energy: 100, level: 1, invites: 0, username: "",
        inventory: {},
        upgrades: { staff: 0, robots: 0, belt: 1 }
    };

    let auto = false, countdown = 180, mmAccount = null;

    const MATERIALS = [
        { id: 'plastic', name: 'Plástico', icon: '🧴', chance: 60, speed: 1500, reward: 1, type: 'common' },
        { id: 'paper', name: 'Papelão', icon: '📦', chance: 20, speed: 1500, reward: 2, type: 'common' },
        { id: 'alum', name: 'Alumínio', icon: '🥫', chance: 12, speed: 1500, reward: 5, type: 'common' },
        { id: 'copper', name: 'Cobre', icon: '🔌', chance: 5, speed: 3000, reward: 15, type: 'rare' },
        { id: 'battery', name: 'Bateria', icon: '🔋', chance: 2, speed: 3000, reward: 30, type: 'rare' },
        { id: 'lithium', name: 'Lítio', icon: '🔋', chance: 1, speed: 4000, reward: 100, type: 'rare' },
        { id: 'parts', name: 'Peças', icon: '💻', chance: 0.8, speed: 4000, reward: 150, type: 'epic' },
        { id: 'phone', name: 'Smartphone', icon: '📱', chance: 0.15, speed: 5000, reward: 1200, type: 'epic' },
        { id: 'board', name: 'Placa-mãe', icon: '🖥️', chance: 0.05, speed: 6000, reward: 2500, type: 'legendary' },
        { id: 'chip', name: 'Chip', icon: '⚡', chance: 0.01, speed: 1000, reward: 2500, type: 'mythic' }
    ];

    const STORE = {
        energy: [
            { name: '+50 Energia', eco: 100, bnb: 0.00002, id: 'e1', desc: 'Recarga imediata' },
            { name: '+100 Energia', eco: 180, bnb: 0.00004, id: 'e2', desc: 'Recarga média' },
            { name: '+500 Energia', eco: 800, bnb: 0.00015, id: 'e3', desc: 'Recarga industrial' }
        ],
        staff: [
            { name: 'Catador', eco: 500, bnb: 0.00010, desc: '+1 mat/ciclo', id: 's1' },
            { name: 'Supervisor', eco: 10000, bnb: 0.00200, desc: 'Eficiência +20%', id: 's3' }
        ],
        robots: [
            { name: 'Robô básico', eco: 5000, bnb: 0.00100, desc: 'Automação leve', id: 'r1' },
            { name: 'Robô industrial', eco: 50000, bnb: 0.01000, desc: '+50 mat/ciclo', id: 'r3' }
        ],
        belts: [
            { name: 'Esteira 2', eco: 1000, bnb: 0.00020, desc: 'Velocidade +20%', id: 'b2' },
            { name: 'Esteira 3', eco: 5000, bnb: 0.00100, desc: 'Velocidade +50%', id: 'b3' }
        ],
        boosters: [
            { name: 'Produção 2x 30min', eco: 300, bnb: 0.00006, id: 'boost1', desc: 'Boost curto' },
            { name: 'Sorte 2x 30min', eco: 500, bnb: 0.00010, id: 'boost3', desc: 'Mais raros' }
        ]
    };

    function save() { localStorage.setItem("recicly_v_final", JSON.stringify(state)); }
    function load() {
        const saved = localStorage.getItem("recicly_v_final");
        if (saved) Object.assign(state, JSON.parse(saved));
        updateUI();
    }

    function updateUI() {
        document.getElementById('header-eco').innerText = Math.floor(state.eco).toLocaleString('pt-BR');
        document.getElementById('header-energy').innerText = state.energy + "/100";
        document.getElementById('header-level').innerText = state.level || 1;
        const name = state.username || (wallet ? wallet.name : "Operador");
        document.getElementById('prof-name').innerText = name;
        document.getElementById('prof-id').innerText = wallet ? wallet.address : "Hub offline";
        document.getElementById('prof-invites').innerText = state.invites;
        document.getElementById('inventory-grid').innerHTML = MATERIALS.map(m => `
            <div class="inv-slot">
                <div class="inv-icon">${m.icon}</div>
                <div class="inv-count">${state.inventory[m.id] || 0}</div>
                <div class="inv-name">${m.name}</div>
            </div>
        `).join('');
    }

    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (btn) btn.classList.add('active');
    }

    function toggleAuto() {
        auto = !auto;
        document.getElementById('btn-loop').innerText = auto ? "⏸ Parar" : "▶ Processar próximo lote";
        if (auto) runCycle();
    }

    function runCycle() {
        if (!auto || state.energy <= 0) {
            if (state.energy <= 0 && auto) toggleAuto();
            return;
        }
        state.energy--;
        let r = Math.random() * 100, acc = 0, sel = MATERIALS[0];
        for (const m of MATERIALS) { acc += m.chance; if (r <= acc) { sel = m; break; } }

        const item = document.getElementById('item-active');
        const special = document.getElementById('special-label');
        item.innerText = sel.icon;
        item.style.left = "-40px";
        special.innerText = (sel.type === 'common') ? "Lote em trânsito" : "Lote especial detectado";

        let start = null;
        function animate(t) {
            if (!start) start = t;
            const progress = (t - start) / sel.speed;
            if (progress < 1) {
                item.style.left = `calc(${progress * 100}% - 28px)`;
                if (auto) requestAnimationFrame(animate);
            } else {
                state.inventory[sel.id] = (state.inventory[sel.id] || 0) + 1;
                const box = document.getElementById('box-main');
                box.classList.add('received');
                setTimeout(() => {
                    box.classList.remove('received');
                    if (auto) runCycle();
                }, sel.type === 'mythic' ? 900 : 160);
                updateUI(); save();
            }
        }
        requestAnimationFrame(animate);
    }

    function sellAll() {
        let gain = 0;
        MATERIALS.forEach(m => {
            gain += (state.inventory[m.id] || 0) * m.reward;
            state.inventory[m.id] = 0;
        });
        state.eco += gain;
        updateUI(); save();
    }

    function filterShop(cat, btn) {
        if (btn) {
            document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }
        document.getElementById('shop-grid').innerHTML = STORE[cat].map(i => `
            <div class="shop-item">
                <div>
                    <h4 class="item-name">${i.name}</h4>
                    <p class="item-desc">${i.desc || ''}</p>
                </div>
                <div class="price-row">
                    <button class="buy-btn eco-btn" onclick="buyItem('${i.id}', ${i.eco}, 'eco')">ECO ${i.eco}</button>
                    <button class="buy-btn bnb-btn" onclick="buyItem('${i.id}', ${i.bnb}, 'bnb')">BNB</button>
                </div>
            </div>
        `).join('');
    }

    function buyItem(id, price, type) {
        if (type === 'eco') {
            if (state.eco < price) return alert("ECO insuficiente");
            state.eco -= price;
        } else {
            alert("Pagamento BNB ainda é teste.");
        }
        updateUI(); save();
    }

    async function connectMetaMask() {
        if (!window.ethereum) return;
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        mmAccount = accounts[0];
        document.getElementById('mm-btn').innerText = mmAccount.slice(0, 6);
    }

    function saveProfile() {
        const name = document.getElementById('input-name').value.trim();
        if (name.length < 3) return alert("Mínimo 3 letras.");
        state.username = name;
        updateUI(); save();
    }

    load();
    filterShop('energy', document.querySelector('.shop-tab'));

    setInterval(() => {
        const el = document.getElementById('energy-timer-header');
        if (state.energy < 100) {
            countdown--;
            if (countdown <= 0) { state.energy++; countdown = 180; updateUI(); }
            const m = Math.floor(countdown / 60), s = countdown % 60;
            el.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        } else {
            el.innerText = "Cheio";
        }
    }, 1000);
</script>
</body>
</html>
