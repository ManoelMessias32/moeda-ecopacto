<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher Ecopacto Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --card: #0f121a; --accent: #22c55e; --text: #ffffff; --muted: #64748b; --border: #ffffff10; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }

        .launcher-card {
            width: 100%; max-width: 480px; background: var(--card); border-radius: 20px;
            padding: 25px; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .header-title { text-align: center; font-weight: 800; font-size: 0.8rem; letter-spacing: 2px; color: var(--muted); margin-bottom: 20px; text-transform: uppercase; }

        .section-box { margin-bottom: 15px; }
        .section-header { font-size: 0.6rem; color: var(--muted); font-weight: 800; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; text-transform: uppercase; }

        .addr-text { color: var(--accent); font-family: 'Fira Code', monospace; font-size: 0.7rem; margin-bottom: 10px; display: block; word-break: break-all; }

        .data-grid { display: grid; gap: 6px; }
        .data-row { display: flex; justify-content: space-between; font-size: 0.75rem; }
        .val-eco { color: var(--accent); font-weight: 700; }
        .status-on { color: var(--accent); font-weight: 800; }

        /* BOTOES PEQUENOS E UM DO LADO DO OUTRO */
        .btn-row { display: flex; gap: 6px; margin: 20px 0; }
        .btn-mini {
            flex: 1; padding: 8px 4px; border-radius: 6px; border: 1px solid var(--border);
            background: #ffffff05; color: #fff; font-size: 0.6rem; font-weight: 800;
            cursor: pointer; transition: 0.2s; white-space: nowrap; text-align: center;
        }
        .btn-mini:hover { background: #ffffff10; }
        .btn-mine-active { background: var(--accent); color: #000; border: none; }

        .logs-title { font-size: 0.6rem; color: var(--muted); font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        .logs-container {
            background: #000; border-radius: 8px; height: 120px; padding: 10px;
            font-family: 'Fira Code', monospace; font-size: 0.6rem; overflow-y: auto;
            color: #a1a1aa; border: 1px solid var(--border);
        }
        .log-entry { margin-bottom: 2px; }
        .log-time { color: var(--muted); margin-right: 5px; }
    </style>
</head>
<body>

    <div class="launcher-card">
        <div class="header-title">ECOPACTO NETWORK</div>

        <div class="section-box">
            <div class="section-header">CARTEIRA</div>
            <span class="addr-text">ECO_2b44246bf6a15b6361379bed</span>
            <div class="data-grid">
                <div class="data-row"><span>Saldo ECO:</span> <span class="val-eco">200.000.000.000 ECO</span></div>
                <div class="data-row"><span>Status:</span> <span class="status-on">ONLINE ✅</span></div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-header">REDE</div>
            <div class="data-grid">
                <div class="data-row"><span>Bloco Atual:</span> <span id="val-block">1</span></div>
                <div class="data-row"><span>Hashrate:</span> <span id="val-hashrate">0 H/s</span></div>
            </div>
        </div>

        <!-- BOTOES LADO A LADO -->
        <div class="btn-row">
            <button class="btn-mini btn-mine-active" id="btn-mine" onclick="toggleMine()">Iniciar Mineração</button>
            <button class="btn-mini" onclick="window.open('https://ecopacto-api-production.up.railway.app/history')">Explorer</button>
            <button class="btn-mini" onclick="window.location.href='index.html'">Abrir Wallet</button>
        </div>

        <div class="logs-title">LOGS DO NÓ</div>
        <div class="logs-container" id="logs">
            <div class="log-entry"><span class="log-time">[21:15:02]</span> Conectando ao RPC...</div>
            <div class="log-entry"><span class="log-time">[21:16:05]</span> RPC conectado</div>
        </div>
    </div>

    <script>
        const API_URL = "https://ecopacto-api-production.up.railway.app";
        let mining = false;

        function toggleMine() {
            mining = !mining;
            const btn = document.getElementById('btn-mine');
            btn.innerText = mining ? "Parar Mineração" : "Iniciar Mineração";
            btn.style.background = mining ? "#ef4444" : "#22c55e";
            btn.style.color = mining ? "#fff" : "#000";
            addLog(mining ? "Minerando..." : "Mineração parada");
        }

        function addLog(msg) {
            const container = document.getElementById('logs');
            const time = new Date().toLocaleTimeString('pt-BR', {hour12:false});
            container.innerHTML += `<div class="log-entry"><span class="log-time">[${time}]</span> ${msg}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        setInterval(async () => {
            try {
                const res = await fetch(`${API_URL}/history`);
                const history = await res.json();
                document.getElementById('val-block').innerText = history.length;
                if(mining) {
                    const hash = Math.floor(Math.random() * 50) + 100;
                    document.getElementById('val-hashrate').innerText = hash + " H/s";
                }
            } catch(e) {}
        }, 5000);
    </script>
</body>
</html>
