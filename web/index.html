<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopacto Network | Master Wallet</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --card: #0f121a; --accent: #22c55e; --text: #ffffff; --muted: #64748b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

        .wallet-card {
            background: var(--card); width: 100%; max-width: 400px; padding: 30px; border-radius: 28px;
            border: 1px solid #ffffff10; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center;
        }

        .network-badge { font-size: 0.65rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px; display: block; }

        .user-info { margin-bottom: 30px; }
        #disp-name { font-size: 1.4rem; font-weight: 800; display: block; }
        #disp-email { font-size: 0.8rem; color: var(--muted); }

        .balance-box { background: #000; padding: 25px; border-radius: 20px; margin-bottom: 25px; border: 1px solid #ffffff05; }
        .balance-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; }
        .balance-amount { font-size: 2.5rem; font-weight: 800; color: #fff; margin: 5px 0; }
        .balance-amount span { color: var(--accent); font-size: 1.2rem; margin-left: 5px; }

        .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-send { background: var(--accent); color: #000; }
        .btn-receive { background: #ffffff08; color: #fff; border: 1px solid #ffffff10; }

        .input-group { background: #000; padding: 15px; border-radius: 15px; margin-top: 15px; display: none; text-align: left; }
        .input-group.active { display: block; }
        input { width: 100%; background: transparent; border: 1px solid #ffffff20; padding: 12px; border-radius: 8px; color: #fff; margin: 8px 0; box-sizing: border-box; outline: none; }

        .node-status { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ffffff10; text-align: left; }
        .node-status h4 { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
        .node-item { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 5px; }
        .status-online { color: var(--accent); }

        #login-view { padding: 40px 0; }
    </style>
</head>
<body>

    <div class="wallet-card">
        <span class="network-badge">ECOPACTO MAINNET</span>

        <div id="login-view">
            <h2 style="margin-bottom: 10px;">Bem-vindo</h2>
            <p style="color:var(--muted); font-size: 0.9rem; margin-bottom: 30px;">Acesse sua carteira master para gerenciar a rede.</p>
            <div id="g_id_onload" data-client_id="161074446700-bdhlr0fn1v9k6b1ojilof968amnsot6o.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
        </div>

        <div id="wallet-view" style="display: none;">
            <div class="user-info">
                <span id="disp-name">Manoel Oliveira</span>
                <span id="disp-email">carregando...</span>
            </div>

            <div class="balance-box">
                <div class="balance-label">SALDO TOTAL</div>
                <div class="balance-amount" id="disp-balance">0<span>ECO</span></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-send" onclick="toggleForm('send')">Enviar</button>
                <button class="btn btn-receive" onclick="toggleForm('receive')">Receber</button>
            </div>

            <div id="form-send" class="input-group">
                <input type="text" id="send-to" placeholder="Endereço de destino ECO_...">
                <input type="number" id="send-amount" placeholder="Quantidade">
                <button class="btn btn-send" style="width:100%" onclick="processSend()">Confirmar Envio</button>
            </div>

            <div id="form-receive" class="input-group">
                <p style="font-size: 0.65rem; color: var(--muted);">SEU ENDEREÇO PÚBLICO:</p>
                <code id="disp-addr" style="font-size: 0.75rem; color: var(--accent); word-break: break-all; cursor:pointer;" onclick="copyAddr()">ECO_...</code>
            </div>

            <div class="node-status">
                <h4>Status da Rede</h4>
                <div id="node-list">
                    <div class="node-item"><span>Nó Principal (Railway)</span> <span class="status-online">ONLINE</span></div>
                    <div class="node-item"><span>Explorador de Blocos</span> <span class="status-online">ATIVO</span></div>
                </div>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://ecopacto-api-production.up.railway.app";
    let currentUser = null;

    function handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));

        fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: payload.email, name: payload.name })
        })
        .then(res => res.json())
        .then(data => {
            currentUser = data;
            showWallet();
        });
    }

    function showWallet() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('wallet-view').style.display = 'block';

        document.getElementById('disp-name').innerText = currentUser.name;
        document.getElementById('disp-email').innerText = currentUser.email;
        document.getElementById('disp-balance').innerHTML = `${currentUser.balance.toLocaleString()}<span>ECO</span>`;
        document.getElementById('disp-addr').innerText = currentUser.address;
    }

    function toggleForm(type) {
        document.getElementById('form-send').classList.remove('active');
        document.getElementById('form-receive').classList.remove('active');
        document.getElementById('form-' + type).classList.add('active');
    }

    async function processSend() {
        const to = document.getElementById('send-to').value;
        const amount = parseInt(document.getElementById('send-amount').value);

        if(!to || !amount) return alert("Preencha todos os campos");

        const res = await fetch(`${API_URL}/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: currentUser.address, to: to, amount: amount })
        });

        const result = await res.json();
        if(result.status === "Transaction Pending") {
            alert("Sucesso! Transação enviada para a rede.");
            location.reload();
        } else {
            alert("Erro: " + result.message);
        }
    }

    function copyAddr() {
        navigator.clipboard.writeText(currentUser.address);
        alert("Endereço copiado!");
    }
</script>
</body>
</html>
