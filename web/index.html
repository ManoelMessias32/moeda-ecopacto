<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopacto Wallet | Gestão Oficial</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --card: #0f121a; --accent: #22c55e;
            --secondary: #3b82f6; --text: #ffffff; --muted: #64748b;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .wallet-card {
            background: var(--card); width: 90%; max-width: 400px; padding: 40px; border-radius: 32px;
            border: 1px solid #ffffff10; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center; margin-top: auto; margin-bottom: auto; backdrop-filter: blur(10px);
        }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        .balance-section { margin: 40px 0; }
        .balance-label { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
        .balance-amount { font-size: 3.5rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .nav-actions { display: flex; gap: 12px; margin-bottom: 30px; }
        .nav-btn {
            flex: 1; padding: 14px; border-radius: 16px; border: none; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .btn-receive { background: #ffffff08; color: var(--text); border: 1px solid #ffffff10; }
        .btn-send { background: var(--accent); color: #000; }
        .view-panel { background: #00000040; padding: 20px; border-radius: 20px; margin-top: 20px; display: none; text-align: left; animation: slideUp 0.3s ease; }
        .view-panel.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input { width: 100%; background: #000; border: 1px solid #ffffff10; padding: 12px; border-radius: 12px; color: white; margin: 8px 0; box-sizing: border-box; }
        .address-box { background: #000; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 0.75rem; color: var(--secondary); word-break: break-all; cursor: pointer; border: 1px dashed #3b82f650; }
        footer { width: 100%; padding: 25px; background: #000; border-top: 1px solid #ffffff10; text-align: center; margin-top: auto; }
        .game-link { color: var(--accent); text-decoration: none; font-weight: 800; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #status-bar { font-size: 0.75rem; color: var(--muted); margin-top: 20px; }
    </style>
</head>
<body>

<div class="wallet-card">
    <h1>ECOPACTO <span style="color:var(--accent); font-size: 0.7rem; vertical-align: super;">V2</span></h1>

    <div id="login-view">
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 30px;">Gerencie seus ativos com segurança.</p>
        <div id="g_id_onload" data-client_id="161074446700-bdhlr0fn1v9k6b1ojilof968amnsot6o.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
    </div>

    <div id="wallet-view" style="display: none;">
        <div class="balance-section">
            <div class="balance-label">SALDO DISPONÍVEL</div>
            <div class="balance-amount" id="disp-balance">0</div>
            <div style="font-size: 0.75rem; color: var(--muted); font-weight: 800;">ECO TOKENS</div>
        </div>
        <div class="nav-actions">
            <button class="nav-btn btn-receive" onclick="showPanel('receive')">Receber</button>
            <button class="nav-btn btn-send" onclick="showPanel('send')">Enviar</button>
        </div>
        <div id="panel-receive" class="view-panel">
            <p style="font-size: 0.7rem; color: var(--muted); margin-bottom: 8px;">Toque para copiar seu endereço:</p>
            <div class="address-box" id="disp-addr" onclick="copyAddr()">Copiando...</div>
        </div>
        <div id="panel-send" class="view-panel">
            <input type="text" id="send-to" placeholder="Destino (ECO_...)">
            <input type="number" id="send-amount" placeholder="Quantidade">
            <button class="nav-btn btn-send" style="width: 100%" onclick="doTransfer()">Confirmar Envio</button>
        </div>
        <div id="status-bar">Rede Online</div>
    </div>
</div>

<footer>
    <a href="game.html" class="game-link">🎮 JOGAR RECICLY CITY</a>
</footer>

<script>
    const API_URL = "https://ecopacto-api-production.up.railway.app";
    let walletData = null;

    function handleCredentialResponse(response) {
        const user = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: user.email })
        }).then(res => res.json()).then(data => {
            walletData = data;
            localStorage.setItem('eco_wallet', JSON.stringify(data));
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('wallet-view').style.display = 'block';
            document.getElementById('disp-balance').innerText = data.balance.toLocaleString();
            document.getElementById('disp-addr').innerText = data.address;
        }).catch(() => alert("Erro ao conectar à rede ECOPACTO."));
    }

    function showPanel(type) {
        document.getElementById('panel-receive').classList.remove('active');
        document.getElementById('panel-send').classList.remove('active');
        document.getElementById(`panel-${type}`).classList.add('active');
    }

    function copyAddr() {
        navigator.clipboard.writeText(walletData.address);
        document.getElementById('status-bar').innerText = "✅ Endereço copiado!";
        setTimeout(() => document.getElementById('status-bar').innerText = "Rede Online", 2000);
    }

    async function doTransfer() {
        const to = document.getElementById('send-to').value;
        const amount = parseInt(document.getElementById('send-amount').value);
        if(!to || !amount) return;
        const res = await fetch(`${API_URL}/transfer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: walletData.address, to: to, amount: amount })
        });
        const data = await res.json();
        if(data.status === "Success") {
            walletData.balance = data.new_balance;
            document.getElementById('disp-balance').innerText = data.new_balance.toLocaleString();
            alert("💸 Enviado com sucesso!");
        } else {
            alert("Erro: Verifique seu saldo e o endereço.");
        }
    }
</script>
</body>
</html>
