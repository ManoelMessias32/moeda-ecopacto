<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopacto Web Wallet</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn:disabled { background: #334155; cursor: not-allowed; }
        .eco-address { font-size: 0.8rem; color: #94a3b8; word-break: break-all; margin: 10px 0; background: #0f172a; padding: 8px; border-radius: 4px; }
        .balance { font-size: 2.5rem; color: #4ade80; text-align: center; margin: 20px 0; font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .status { font-size: 0.8rem; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>ECOPACTO <span style="font-size: 0.5em; color: #22c55e;">v2</span></h1>

    <!-- TELA DE LOGIN -->
    <div class="card" id="login-card">
        <h3 style="text-align:center;">Acesse sua Carteira</h3>
        <p style="color: #94a3b8; text-align:center; font-size: 0.9rem;">Use sua conta Google para gerenciar seus ECOs.</p>
        <div id="g_id_onload"
             data-client_id="161074446700-bdhlr0fn1v9k6b1ojilof968amnsot6o.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
    </div>

    <!-- TELA DA CARTEIRA -->
    <div class="card" id="wallet-card" style="display:none;">
        <div class="balance" id="eco-balance">0 ECO</div>
        <div style="text-align: center; color: #94a3b8; font-size: 0.8rem;">Endereço da Carteira:</div>
        <div class="eco-address" id="eco-addr">ECO_...</div>

        <button class="btn" id="mine-btn" onclick="mine()">⛏️ Minerar Bloco (Teste)</button>

        <div style="margin: 20px 0; border-top: 1px solid #334155; padding-top: 20px;">
            <label style="font-size: 0.9rem;">Enviar ECO</label>
            <input type="text" placeholder="Endereço de Destino (ECO_...)" id="dest">
            <input type="number" placeholder="Quantidade" id="amount">
            <button class="btn" style="background: #3b82f6;" onclick="transfer()">Transferir (Taxa 1%)</button>
        </div>
        <div class="status" id="tx-status"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8080"; // Mude para o link do Google Cloud depois
        let userWallet = null;

        // Decodifica o Token do Google para pegar o e-mail
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        async function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            const email = responsePayload.email;

            document.getElementById('tx-status').innerText = "Conectando à Blockchain...";

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                userWallet = await res.json();
                updateUI();
            } catch (err) {
                alert("Erro ao conectar com o servidor da moeda. Certifique-se que o main.go está rodando!");
            }
        }

        function updateUI() {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('wallet-card').style.display = 'block';
            document.getElementById('eco-balance').innerText = `${userWallet.balance} ECO`;
            document.getElementById('eco-addr').innerText = userWallet.address;
            document.getElementById('tx-status').innerText = "";
        }

        async function mine() {
            if (!userWallet) return;
            const btn = document.getElementById('mine-btn');
            btn.disabled = true;
            btn.innerText = "Minerando...";

            try {
                const res = await fetch(`${API_URL}/mine?address=${userWallet.address}`);
                const data = await res.json();
                userWallet.balance = data.balance;
                updateUI();
                alert("Bloco Minerado com Sucesso!");
            } catch (err) {
                alert("Erro na mineração.");
            } finally {
                btn.disabled = false;
                btn.innerText = "⛏️ Minerar Bloco (Teste)";
            }
        }

        async function transfer() {
            const dest = document.getElementById('dest').value;
            const amount = document.getElementById('amount').value;

            if (!dest || !amount) return alert("Preencha todos os campos");

            try {
                const res = await fetch(`${API_URL}/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from: userWallet.address, to: dest, amount: parseInt(amount) })
                });
                const data = await res.json();
                if (data.status === "Success") {
                    userWallet.balance = data.new_balance;
                    updateUI();
                    alert(`Sucesso! Taxa paga: ${data.fee} ECO`);
                } else {
                    alert("Falha na transferência: verifique o saldo e o endereço.");
                }
            } catch (err) {
                alert("Erro ao processar transferência.");
            }
        }
    </script>
</body>
</html>
