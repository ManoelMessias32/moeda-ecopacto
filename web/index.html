<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopacto Hub | HUB</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --card: #0f121a; --accent: #22c55e; --text: #ffffff; --muted: #64748b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; padding: 10px; box-sizing: border-box; }

        .wallet-card { background: var(--card); width: 100%; max-width: 360px; padding: 25px; border-radius: 20px; border: 1px solid #ffffff10; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
        .balance-label { color: var(--muted); font-size: 0.6rem; font-weight: 800; letter-spacing: 1px; }
        .balance-amount { font-size: 2.5rem; font-weight: 800; color: var(--accent); margin: 5px 0; }

        .nav-actions { display: flex; gap: 8px; margin-bottom: 15px; }
        .nav-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.75rem; }
        .btn-receive { background: #ffffff08; color: var(--text); border: 1px solid #ffffff10; }
        .btn-send { background: var(--accent); color: #000; }

        .view-panel { background: #00000040; padding: 12px; border-radius: 12px; margin-top: 10px; display: none; text-align: left; animation: slideUp 0.3s ease; }
        .view-panel.active { display: block; }
        input { width: 100%; background: #000; border: 1px solid #ffffff10; padding: 12px; border-radius: 8px; color: white; margin: 4px 0; box-sizing: border-box; font-size: 0.8rem; }
        .address-box { background: #000; padding: 8px; border-radius: 8px; font-family: monospace; font-size: 0.65rem; color: #3b82f6; word-break: break-all; cursor: pointer; border: 1px dashed #3b82f650; }

        /* JOGAR BUTTON - INTEGRADO AO CARD */
        #game-entrance { margin-top: 20px; padding-top: 15px; border-top: 1px solid #ffffff10; display: none; }
        .btn-play {
            width: 100%; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: var(--accent);
            border: 1px solid var(--accent); padding: 12px; border-radius: 12px; font-weight: 800; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; font-size: 0.8rem;
        }
        .btn-play:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="wallet-card">
        <h1>ECOPACTO <span style="color:var(--accent)">HUB</span></h1>

        <div id="login-view">
            <p style="color:var(--muted); font-size: 0.8rem; margin-bottom: 20px;">Conecte sua conta para gerenciar e jogar.</p>
            <div id="g_id_onload" data-client_id="161074446700-bdhlr0fn1v9k6b1ojilof968amnsot6o.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
        </div>

        <div id="wallet-view" style="display: none;">
            <div class="balance-label">SALDO DISPONÍVEL</div>
            <div class="balance-amount" id="disp-balance">0</div>

            <div class="nav-actions">
                <button class="nav-btn btn-receive" onclick="showPanel('receive')">Receber</button>
                <button class="nav-btn btn-send" onclick="showPanel('send')">Enviar</button>
            </div>

            <div id="panel-receive" class="view-panel"><div class="address-box" id="disp-addr" onclick="copyAddress()">...</div></div>
            <div id="panel-send" class="view-panel">
                <input type="text" id="send-to" placeholder="Destino (ECO_...)">
                <input type="number" id="send-amount" placeholder="Quantidade">
                <button class="nav-btn btn-send" style="width:100%" onclick="doTransfer()">Enviar ECO</button>
            </div>

            <div id="game-entrance">
                <a href="game.html" class="btn-play">🎮 JOGAR RECICLY CITY</a>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://ecopacto-api-production.up.railway.app";
    let walletData = null;

    function handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));

        fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: payload.email })
        })
        .then(res => res.json())
        .then(data => {
            walletData = data;
            localStorage.setItem('eco_wallet', JSON.stringify(data));

            document.getElementById('login-view').style.display = 'none';
            document.getElementById('wallet-view').style.display = 'block';
            document.getElementById('game-entrance').style.display = 'block';

            document.getElementById('disp-balance').innerText = data.balance.toLocaleString();
            document.getElementById('disp-addr').innerText = data.address;
        })
        .catch(err => alert("Erro de conexão."));
    }

    function showPanel(type) {
        document.getElementById('panel-receive').classList.toggle('active', type === 'receive');
        document.getElementById('panel-send').classList.toggle('active', type === 'send');
    }

    function copyAddress() {
        navigator.clipboard.writeText(walletData.address);
        alert("Copiado!");
    }

    async function doTransfer() {
        const to = document.getElementById('send-to').value;
        const amount = parseInt(document.getElementById('send-amount').value);
        if(!to || !amount) return;

        const res = await fetch(`${API_URL}/transfer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: walletData.address, to: to, amount: amount })
        });
        const data = await res.json();
        if(data.status === "Success") {
            walletData.balance = data.new_balance;
            document.getElementById('disp-balance').innerText = data.new_balance.toLocaleString();
            alert("Sucesso!");
        }
    }
</script>
</body>
</html>
